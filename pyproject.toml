[project]
name = "ken3170"
version = "0.1.0"
description = "KEN3170 Computational Neuroscience"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "rsatoolbox",
    "scipy",
    "soundfile",
    "torch",
    "torchaudio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "assignment/models.py",
    "assignment/train.py",
]

[tool.hatch.build.targets.wheel.sources]
"assignment" = ""
